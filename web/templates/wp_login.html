<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In &lsaquo; WordPress</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <style>
        body { background: #f0f0f1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { width: 320px; padding: 24px; background: #fff; border: 1px solid #c3c4c7; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .error { border-left: 4px solid #d63638; background: #fff; box-shadow: 0 1px 1px 0 rgba(0,0,0,.1); margin-bottom: 16px; padding: 12px; font-size: 13px; }
        label { font-size: 14px; color: #3c434a; margin-bottom: 4px; display: block; }
        input[type="text"], input[type="password"] { width: 100%; padding: 6px 10px; margin-bottom: 16px; border: 1px solid #8c8f94; border-radius: 4px; box-sizing: border-box; }
        input[type="submit"] { background: #2271b1; color: #fff; border: none; padding: 8px 16px; border-radius: 3px; cursor: pointer; font-weight: 600; width: 100%; }
        input[type="submit"]:hover { background: #135e96; }
    </style>
</head>
<body>
    <div class="login-box">
        {{if .Error}}
        <div class="error">
            <strong>Error:</strong> The username <strong>{{.Username}}</strong> is not registered on this site.
        </div>
        {{end}}
        <form method="post" action="/wp-login.php">
            <label for="log">Username or Email Address</label>
            <input type="text" name="log" id="log" required autocomplete="username">
            <label for="pwd">Password</label>
            <input type="password" name="pwd" id="pwd" required autocomplete="current-password">
            <input type="submit" name="wp-submit" id="wp-submit" value="Log In">
        </form>
    </div>
</body>
</html>
