<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk - Madu</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login">
  <main class="card">
    <div class="logo">{{template "logo"}} Madu</div>
    <p class="sub">Honeypot dashboard</p>
    {{if .Info}}<p class="info" role="status">{{.Info}}</p>{{end}}
    {{if .Error}}<p class="err" role="alert">{{.Error}}</p>{{end}}
    
    <form method="post" action="/masuk" autocomplete="off">
      <input type="hidden" name="ft" value="{{.FT}}">
      
      <label for="u">Username</label>
      <input id="u" name="username" required maxlength="20">
      
      <label for="p">Password</label>
      <div style="position: relative; display: block; width: 100%;">
          <input id="p" name="password" type="password" required minlength="8" maxlength="72" style="width: 100%; box-sizing: border-box; padding-right: 45px; margin: 0; display: block;">
          
          <!-- HAPUS onclick, GUNAKAN id="toggle-p" -->
          <span id="toggle-p" style="position: absolute; right: 5px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #94a3b8; display: flex; align-items: center; justify-content: center; z-index: 20; padding: 10px;">
              <svg id="eye-open-p" style="pointer-events: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg id="eye-closed-p" style="display: none; pointer-events: none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
          </span>
      </div>
      
      <button type="submit" style="margin-top: 15px;">Masuk</button>
    </form>
    <p class="alt">Belum punya akun? <a href="/daftar">Daftar</a></p>
  </main>

  <!-- Panggil JavaScript eksternal agar diizinkan oleh CSP -->
  <script src="/static/script.js"></script>
</body>
</html>
